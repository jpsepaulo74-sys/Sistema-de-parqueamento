<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Entrada - Minimal</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container">
    <h1>Registo de Entrada (Minimal)</h1>

    <form id="frmEntrada" class="card">
      <label>Matrícula
        <input id="entMat" placeholder="AB-00-CD" maxlength="12" required>
      </label>

      <label>Tipo de Viatura
        <select id="entTipo" required></select>
      </label>

      <label>Vaga
        <select id="entVaga" required></select>
      </label>

      <label>Data / Hora
        <input id="entHora" type="datetime-local" required>
      </label>

      <div class="actions">
        <button type="button" id="btnAutoVaga">Atribuição automática</button>
        <button type="submit" id="btnConfirm">Confirmar Entrada</button>
      </div>
    </form>

    <section class="status">
      <h2>Vagas</h2>
      <div id="vagaGrid" class="vaga-grid"></div>

      <h2>Ocupações</h2>
      <ul id="ocupList" class="list"></ul>
    </section>
  </main>

  <script src="javascript/app.js"></script>
</body>
</html>
